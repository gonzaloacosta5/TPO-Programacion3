spring.application.name=logistica-perfumeria

# Si existe un archivo ".env" en la carpeta desde la que se ejecuta la app (está en .gitignore),
# sus variables se leen como propiedades. Si no existe, se ignora y se usan las variables del sistema.
spring.config.import=optional:file:.env[.properties]

# --- Neo4j ---------------------------------------------------------------
# Ninguna credencial vive en el repositorio: usuario y contraseña se leen de
# variables de entorno y NO tienen valor por defecto a propósito. Si falta
# alguna, la aplicación no arranca y lo dice en el log (ver README).
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# --- Datos semilla ---------------------------------------------------------
# Si la base está vacía al arrancar, carga la red logística de ejemplo.
logistica.semilla.habilitada=true

# --- Errores: nunca exponer stack traces ni detalles internos --------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
